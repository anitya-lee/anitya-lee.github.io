---
layout: default
---

<article class="page">
  <h1>{{ page.title }}</h1>
  <div class="meta">
    {{ page.date | date: "%Y · %m · %d" }}
    {% if page.tags %}
      &nbsp;·&nbsp;
      {% for tag in page.tags %}<span>{{ tag }}</span>{% unless forloop.last %}, {% endunless %}{% endfor %}
    {% endif %}
  </div>
  <div class="page-body">
    {{ content }}
  </div>
</article>
