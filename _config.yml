# ===== Site =====
title: Yuri Lee
description: I connect Technology, Human Experience, and the Questions worth solving.
author: Yuri Lee
email: lur0680@naver.com
url: https://anitya-lee.github.io
lang: en

# ===== Build =====
markdown: kramdown
highlighter: rouge
permalink: /essays/:slug/

# ===== Posts =====
defaults:
  - scope: { path: "", type: "posts" }
    values:
      layout: essay

paginate: 10
paginate_path: /essays/page:num/

# ===== Plugins (GitHub Pages whitelist) =====
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# ===== Exclude from build =====
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .superpowers
  - ref
  - font
  - about
  - back_data
  - guides
  - decisions.md
  - deploy-audit.md
  - main.png
  - main.mp4
  - evolution.jpg
  - evolution2.jpg
  - .DS_Store

# ===== SEO defaults =====
twitter:
  username: anitya_lee
social:
  name: Yuri Lee
  links:
    - https://github.com/anitya-lee
