---
layout: default
title: Essays
description: Field notes, essays, and slow thinking by Yuri Lee.
permalink: /essays/
---

<div class="page">
  <h1>Essays</h1>
  <div class="meta">Field notes &amp; slow thinking</div>

  <ul class="essay-list">
    {% for post in site.posts %}
    <li>
      <a href="{{ post.url | relative_url }}">
        <div class="title">{{ post.title }}</div>
        <div class="date">{{ post.date | date: "%Y · %m · %d" }}</div>
      </a>
    </li>
    {% endfor %}
  </ul>
</div>
